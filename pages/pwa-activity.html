<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>시니어안심살핌 (사업단 활동) - 통합 체크인 PWA</title>
<meta name="theme-color" content="#ffffff">

<!-- iOS PWA 전용 메타 태그 및 전체화면 지원 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시니어안심살핌">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/x-icon" href="../favicon.ico?v=2">
<link rel="apple-touch-icon" href="../icon-192.png?v=2">

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/common.css?v=2.6.0">
<link rel="stylesheet" href="../css/pwa.css?v=2.6.1">

<style>
  /* 전역 폰트 일원화 (Pretendard 기반) */
  body, button, input, select, textarea {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif !important;
    letter-spacing: -0.02em;
  }

  /* 게이트키퍼 & 시니어안심살핌 표준 5:5 버튼 스타일 */
  .btn-action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 18px;
  }
  .btn-primary {
    width: 100%;
    min-height: 44px;
    height: 44px;
    background: #0f172a;
    color: #ffffff;
    border: 1px solid #0f172a;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .btn-primary:active {
    background: #1e293b;
  }
  .btn-secondary {
    width: 100%;
    min-height: 44px;
    height: 44px;
    background: #ffffff;
    color: #475569;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .btn-secondary:active {
    background: #f1f5f9;
  }

  /* 성별 및 옵션 5:5 스위치 토글 (게이트키퍼/시니어안심살핌 정통 규격) */
  .obs-btn-switch {
    padding: 6px 12px;
    min-height: 40px;
    height: 40px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #475569;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .obs-btn-switch.active,
  .obs-btn-switch.selected-clean {
    background: #0f172a;
    border-color: #0f172a;
    color: #ffffff;
    font-weight: 800;
  }
</style>

<!-- Daum / Kakao Postcode Address Search Service -->
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<!-- html2pdf 공식 PDF 출력 엔진 -->
<script src="../lib/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- TOP GLOBAL NAV (Clean White Flat 표준 규격) -->
<header class="top-nav">
  <div class="top-nav-inner">
    <div class="brand-group" style="display: flex; align-items: center; gap: 8px;">
      <span class="brand-badge" style="background: #0f172a; color: #ffffff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.5px;">시니어안심</span>
      <span class="brand-title" style="color: #0f172a; font-size: 15px; font-weight: 800; letter-spacing: -0.01em;">시니어안심살핌</span>
    </div>
    <div id="headerActiveStatus" style="font-size: 12px; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 6px;">
      <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b;"></span>
      <span>출근 전</span>
    </div>
  </div>
</header>

<!-- 메인 컨테이너 (표준 pwa-container) -->
<main class="pwa-container">

  <!-- 5단계 프로그레시브 네비게이션 탭 -->
  <nav class="pwa-step-tabs">
    <button type="button" class="pwa-tab-item active" data-step="1">
      <span class="tab-num-badge">1</span><span class="tab-label">기관·사업단</span>
    </button>
    <button type="button" class="pwa-tab-item upcoming" data-step="2">
      <span class="tab-num-badge">2</span><span class="tab-label">대상자</span>
    </button>
    <button type="button" class="pwa-tab-item upcoming" data-step="3">
      <span class="tab-num-badge">3</span><span class="tab-label">현장공통</span>
    </button>
    <button type="button" class="pwa-tab-item upcoming" data-step="4">
      <span class="tab-num-badge">4</span><span class="tab-label">활동보고</span>
    </button>
    <button type="button" class="pwa-tab-item upcoming" data-step="5">
      <span class="tab-num-badge">5</span><span class="tab-label">마감·퇴근</span>
    </button>
  </nav>

  <!-- 뷰 컨테이너 -->
  <div id="stepViewContainer">
    <div style="text-align: center; padding: 40px 0; color: #64748b; font-size: 13px;">
      화면을 준비하는 중입니다...
    </div>
  </div>

</main>

<!-- ESM 진입 스크립트 -->
<script type="module" src="../js/pwa-activity/activityApp.js"></script>

</body>
</html>
