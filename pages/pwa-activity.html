<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>부평 통합돌봄사업단 - 활동보고 PWA</title>
<meta name="theme-color" content="#ffffff">

<!-- iOS PWA 전용 메타 태그 및 전체화면 지원 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="부평 사업단">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="../manifest-activity.json?v=1.0.1">
<link rel="icon" type="image/png" sizes="192x192" href="../img/icons/icon-activity-192.png?v=1.0.1">
<link rel="icon" type="image/png" sizes="512x512" href="../img/icons/icon-activity-512.png?v=1.0.1">
<link rel="apple-touch-icon" href="../img/icons/apple-touch-activity.png?v=1.0.1">

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/common.css?v=2.6.0">
<link rel="stylesheet" href="../css/pwa.css?v=2.6.1">

<style>
  /* 전역 폰트 일원화 (Pretendard 기반) */
  body, button, input, select, textarea {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif !important;
    letter-spacing: -0.02em;
  }

  /* 게이트키퍼 & 시니어안심살핌 표준 5:5 버튼 스타일 */
  .btn-action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 18px;
  }
  .btn-primary {
    width: 100%;
    min-height: 44px;
    height: 44px;
    background: #0f172a;
    color: #ffffff;
    border: 1px solid #0f172a;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .btn-primary:active {
    background: #1e293b;
  }
  .btn-secondary {
    width: 100%;
    min-height: 44px;
    height: 44px;
    background: #ffffff;
    color: #475569;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .btn-secondary:active {
    background: #f1f5f9;
  }

  /* 성별 및 옵션 5:5 스위치 토글 */
  .obs-btn-switch {
    padding: 6px 12px;
    min-height: 40px;
    height: 40px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: #475569;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .obs-btn-switch.active,
  .obs-btn-switch.selected-clean {
    background: #0f172a;
    border-color: #0f172a;
    color: #ffffff;
    font-weight: 800;
  }

  /* ========================================================
     부평 사업단 오프닝 인트로 스플래시 스타일
     ======================================================== */
  .intro-splash-overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background-color: #ffffff;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    overflow: hidden;
    transition: opacity 0.7s ease-in-out, visibility 0.7s ease-in-out;
  }
  .intro-splash-overlay.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .intro-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    user-select: none;
  }
  svg.intro-heart {
    width: 86px;
    height: 86px;
    overflow: visible;
  }
  svg.intro-heart path {
    fill: rgba(13, 148, 136, 0);
    stroke: #0d9488;
    stroke-width: 1.3;
    stroke-dasharray: 85;
    stroke-dashoffset: 85;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation:
      introDrawHeart 1.3s ease-in-out forwards,
      introFillHeart 0.5s ease-out 1.3s forwards;
  }
  @keyframes introDrawHeart {
    to { stroke-dashoffset: 0; }
  }
  @keyframes introFillHeart {
    to { fill: rgba(13, 148, 136, 0.14); }
  }
  .dual-logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    opacity: 0;
    animation: introFadeUp 0.8s ease-out 1.2s forwards;
  }
  .incheon-logo {
    height: 30px;
    width: auto;
    object-fit: contain;
  }
  .bupyeong-logo {
    height: 36px;
    width: auto;
    object-fit: contain;
  }
  .logo-divider {
    width: 1px;
    height: 24px;
    background-color: #cbd5e1;
  }
  .intro-badge-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: 0;
    animation: introFadeUp 0.8s ease-out 1.7s forwards;
    white-space: nowrap;
    margin-top: 4px;
  }
  .badge-service {
    padding: 7px 18px;
    border: 2px solid #0f172a;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
    background-color: #ffffff;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    white-space: nowrap;
  }
  .badge-circles {
    display: flex;
    gap: 4px;
  }
  .circle-item {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background-color: #7cb342;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14.5px;
    font-weight: 700;
    box-shadow: 0 2px 5px rgba(124, 179, 66, 0.3);
  }
  .intro-sub-text {
    font-family: 'Gowun Dodum', 'Pretendard', sans-serif;
    font-size: 15.5px;
    font-weight: 400;
    color: #475569;
    margin-top: 2px;
    opacity: 0;
    animation: introFadeUp 0.8s ease-out 2.0s forwards;
  }
  @keyframes introFadeUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .intro-skip-hint {
    position: absolute;
    bottom: 22px;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: -0.01em;
    opacity: 0;
    animation: introFadeUp 0.8s ease-out 2.2s forwards;
  }
</style>

<!-- Daum / Kakao Postcode Address Search Service -->
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<!-- html2pdf 공식 PDF 출력 엔진 -->
<script src="../lib/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- PWA 오프닝 인트로 스플래시 (부평 사업단) -->
<div id="pwaIntroSplash" class="intro-splash-overlay" onclick="closeActivitySplash()" title="화면을 터치하면 건너뜁니다">
  <div class="intro-stack">
    <svg class="intro-heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>

    <div class="dual-logo-wrap">
      <img src="../img/incheon_intro_logo.png" alt="인천광역시 로고" class="incheon-logo">
      <div class="logo-divider"></div>
      <img src="../img/부평구.png" alt="부평구 로고" class="bupyeong-logo">
    </div>

    <div class="intro-badge-group">
      <div class="badge-service">통합돌봄사업단</div>
      <div class="badge-circles">
        <span class="circle-item">부</span>
        <span class="circle-item">평</span>
        <span class="circle-item">구</span>
      </div>
    </div>

    <div class="intro-sub-text">인천광역시, 부평구가 함께합니다.</div>
  </div>

  <div class="intro-skip-hint">화면을 터치하면 즉시 시작합니다</div>
</div>

<!-- TOP GLOBAL NAV (Clean White Flat 표준 규격) -->
<header class="top-nav">
  <div class="top-nav-inner">
    <div class="brand-group" style="display: flex; align-items: center; gap: 8px;">
      <span class="brand-badge" style="background: #0d9488; color: #ffffff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.5px;">부평구</span>
      <span class="brand-title" style="color: #0f172a; font-size: 15px; font-weight: 800; letter-spacing: -0.01em;">통합돌봄사업단</span>
    </div>
    <div id="headerActiveStatus" style="font-size: 12px; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 6px;">
      <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b;"></span>
      <span>출근 전</span>
    </div>
  </div>
</header>

<!-- 메인 컨테이너 (표준 pwa-container) -->
<main class="pwa-container">

  <!-- 5단계 프로그레시브 네비게이션 탭 -->
  <nav class="pwa-step-tabs">
    <button type="button" class="pwa-tab-item active" data-step="1">
      <span class="tab-num-badge">1</span><span class="tab-label">기관·사업단</span>
    </button>
    <button type="button" class="pwa-tab-item upcoming" data-step="2">
      <span class="tab-num-badge">2</span><span class="tab-label">대상자</span>
    </button>
    <button type="button" class="pwa-tab-item upcoming" data-step="3">
      <span class="tab-num-badge">3</span><span class="tab-label">현장공통</span>
    </button>
    <button type="button" class="pwa-tab-item upcoming" data-step="4">
      <span class="tab-num-badge">4</span><span class="tab-label">활동보고</span>
    </button>
    <button type="button" class="pwa-tab-item upcoming" data-step="5">
      <span class="tab-num-badge">5</span><span class="tab-label">마감·퇴근</span>
    </button>
  </nav>

  <!-- 뷰 컨테이너 -->
  <div id="stepViewContainer">
    <div style="text-align: center; padding: 40px 0; color: #64748b; font-size: 13px;">
      화면을 준비하는 중입니다...
    </div>
  </div>

</main>

<!-- ESM 진입 스크립트 -->
<script type="module" src="../js/pwa-activity/activityApp.js"></script>

<!-- 부평 사업단 PWA 독립 Service Worker 등록 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw-activity.js')
        .then(reg => console.log('[Bupyeong Activity SW] 등록 성공:', reg.scope))
        .catch(err => console.warn('[Bupyeong Activity SW] 등록 실패:', err));
    });
  }
</script>

<!-- 스플래시 인트로 자동/터치 제어 -->
<script>
  let splashTimer = null;
  function closeActivitySplash() {
    const splash = document.getElementById('pwaIntroSplash');
    if (splash) {
      splash.classList.add('fade-out');
    }
    if (splashTimer) clearTimeout(splashTimer);
  }
  window.addEventListener('load', () => {
    splashTimer = setTimeout(closeActivitySplash, 3200);
  });
</script>

</body>
</html>
