<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부평구 통합돌봄 - 참여기관 관리자 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../css/common.css">
<style>
  body {
    background: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    border: 1px solid #e2e8f0;
  }
  .login-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .login-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 11.5px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .login-title {
    font-size: 21px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .login-sub {
    font-size: 13px;
    color: #64748b;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    background: #ffffff;
    box-sizing: border-box;
    transition: all 0.2s;
  }
  .form-input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .btn-submit {
    width: 100%;
    height: 46px;
    background: #0f172a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .btn-submit:hover {
    background: #1e293b;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <span class="login-badge">인천광역시 부평구 통합돌봄</span>
    <h1 class="login-title">참여기관 관리자 로그인</h1>
    <p class="login-sub">부평구 통합돌봄 관제 및 대상자 관리 시스템</p>
  </div>

  <form id="adminLoginForm">
    <div class="form-group">
      <label class="form-label" for="loginOrgCode">기관 코드</label>
      <input type="text" class="form-input" id="loginOrgCode" value="O-28-237-01" readonly style="background: #f8fafc; font-family: monospace; font-weight: 700;">
    </div>

    <div class="form-group">
      <label class="form-label" for="loginAdminId">관리자 아이디</label>
      <input type="text" class="form-input" id="loginAdminId" value="bupyeong_admin" placeholder="아이디 입력" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="loginPassword">비밀번호</label>
      <input type="password" class="form-input" id="loginPassword" value="123456" placeholder="비밀번호 입력" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-submit" id="btnAdminLogin">관리자 로그인</button>
  </form>

  <div style="margin-top: 20px; text-align: center; font-size: 12px; color: #94a3b8;">
    부평구 통합돌봄센터 & 노인인력개발센터 참여기관 전용망
  </div>
</div>

<script>
  document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    sessionStorage.setItem('bupyeong_admin_auth', 'true');
    sessionStorage.setItem('bupyeong_admin_id', document.getElementById('loginAdminId').value.trim());
    sessionStorage.setItem('bupyeong_org_uid', 'O-28-237-01');
    window.location.replace('org-admin.html');
  });
</script>

</body>
</html>
